name: Windows Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional release tag (blank uses v<package version>)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare-muscriptor-models:
    name: Validate MuScriptor model sources
    runs-on: windows-latest
    environment: windows-release
    timeout-minutes: 180
    env:
      REQUESTED_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          clean: true
          persist-credentials: false

      - name: Restore MuScriptor small cache
        id: muscriptor_small_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: models/muscriptor/small
          key: muscriptor-small-${{ runner.os }}-${{ hashFiles('app/packaging/verify-muscriptor-models.ps1') }}

      - name: Restore and verify MuScriptor small model source
        if: steps.muscriptor_small_cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./scripts/restore_ci_muscriptor_model_source.ps1
          -Variant small
          -RequestedTag $env:REQUESTED_TAG

      - name: Verify MuScriptor small model
        shell: pwsh
        run: ./app/packaging/verify-muscriptor-models.ps1 -Variant small

      - name: Save MuScriptor small cache
        if: steps.muscriptor_small_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: models/muscriptor/small
          key: ${{ steps.muscriptor_small_cache.outputs.cache-primary-key }}

      - name: Remove MuScriptor small files
        shell: pwsh
        run: ./scripts/cleanup_ci_release_build.ps1 -Phase AfterPackaging

      - name: Restore MuScriptor medium cache
        id: muscriptor_medium_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: models/muscriptor/medium
          key: muscriptor-medium-${{ runner.os }}-${{ hashFiles('app/packaging/verify-muscriptor-models.ps1') }}

      - name: Restore and verify MuScriptor medium model source
        if: steps.muscriptor_medium_cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./scripts/restore_ci_muscriptor_model_source.ps1
          -Variant medium
          -RequestedTag $env:REQUESTED_TAG

      - name: Verify MuScriptor medium model
        shell: pwsh
        run: ./app/packaging/verify-muscriptor-models.ps1 -Variant medium

      - name: Save MuScriptor medium cache
        if: steps.muscriptor_medium_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: models/muscriptor/medium
          key: ${{ steps.muscriptor_medium_cache.outputs.cache-primary-key }}

      - name: Remove MuScriptor medium files
        shell: pwsh
        run: ./scripts/cleanup_ci_release_build.ps1 -Phase AfterPackaging

      - name: Restore MuScriptor large cache
        id: muscriptor_large_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: models/muscriptor/large
          key: muscriptor-large-${{ runner.os }}-${{ hashFiles('app/packaging/verify-muscriptor-models.ps1') }}

      - name: Restore and verify MuScriptor large model source
        if: steps.muscriptor_large_cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./scripts/restore_ci_muscriptor_model_source.ps1
          -Variant large
          -RequestedTag $env:REQUESTED_TAG

      - name: Verify MuScriptor large model
        shell: pwsh
        run: ./app/packaging/verify-muscriptor-models.ps1 -Variant large

      - name: Save MuScriptor large cache
        if: steps.muscriptor_large_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: models/muscriptor/large
          key: ${{ steps.muscriptor_large_cache.outputs.cache-primary-key }}

      - name: Remove build intermediates
        shell: pwsh
        run: ./scripts/cleanup_ci_release_build.ps1 -Phase AfterPackaging

  build:
    name: Build release assets
    needs: prepare-muscriptor-models
    runs-on: windows-latest
    timeout-minutes: 300
    env:
      NPM_CONFIG_PROGRESS: "false"
      UV_LINK_MODE: copy
      UV_NO_PROGRESS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          clean: true
          persist-credentials: false

      - name: Remove previous build outputs
        shell: pwsh
        run: ./scripts/cleanup_ci_release_build.ps1 -Phase BeforeBuild

      - name: Check repository hygiene
        shell: pwsh
        run: ./scripts/check_repository_hygiene.ps1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Set up MSYS2 toolchain
        id: setup_msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: MINGW64
          release: true
          update: false
          install: >-
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            diffutils

      - name: Configure native build paths
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.setup_msys2.outputs.msys2-location }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MSYS2_LOCATION)) {
            throw "MSYS2 setup did not return its installation directory."
          }
          $msys2Root = [IO.Path]::GetFullPath($env:MSYS2_LOCATION)
          $required = @(
            (Join-Path $msys2Root "usr\bin\bash.exe"),
            (Join-Path $msys2Root "usr\bin\cmp.exe"),
            (Join-Path $msys2Root "msys2_shell.cmd"),
            (Join-Path $msys2Root "mingw64\bin\gcc.exe"),
            (Join-Path $msys2Root "mingw64\bin\g++.exe"),
            (Join-Path $msys2Root "mingw64\bin\objdump.exe")
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required native build tool was not found: $path"
            }
          }
          $sevenZip = Get-Command "7z.exe" -ErrorAction SilentlyContinue
          if (
            $null -eq $sevenZip -and
            -not (Test-Path -LiteralPath "C:\Program Files\7-Zip\7z.exe" -PathType Leaf)
          ) {
            throw "Required native build command was not found: 7z.exe"
          }
          foreach ($command in @("cmake.exe", "ninja.exe")) {
            if (-not (Get-Command $command -ErrorAction SilentlyContinue)) {
              throw "Required native build command was not found: $command"
            }
          }
          "EARCOPY_MSYS2_ROOT=$msys2Root" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Python dependencies
        timeout-minutes: 25
        run: uv sync --extra dev --locked

      - name: Install desktop dependencies
        timeout-minutes: 15
        working-directory: app
        run: npm ci

      - name: Run Python tests
        timeout-minutes: 20
        run: uv run pytest -q

      - name: Run desktop tests
        timeout-minutes: 15
        working-directory: app
        run: npm test -- --run

      - name: Check desktop types
        timeout-minutes: 10
        working-directory: app
        run: npm run typecheck

      - name: Restore LGPL FFmpeg cache
        id: ffmpeg_cache_restore
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            tools/ffmpeg-lgpl/downloads
            tools/ffmpeg-lgpl/bin
          key: ffmpeg-lgpl-${{ runner.os }}-${{ hashFiles('scripts/build_ffmpeg_lgpl.ps1') }}

      - name: Build LGPL FFmpeg
        timeout-minutes: 25
        shell: pwsh
        run: ./scripts/build_ffmpeg_lgpl.ps1

      - name: Save LGPL FFmpeg cache
        if: steps.ffmpeg_cache_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            tools/ffmpeg-lgpl/downloads
            tools/ffmpeg-lgpl/bin
          key: ffmpeg-lgpl-${{ runner.os }}-${{ hashFiles('scripts/build_ffmpeg_lgpl.ps1') }}

      - name: Restore LGPL libsndfile cache
        id: libsndfile_cache_restore
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            app/release-sources/libsndfile-1.2.2.tar.xz
            tools/libsndfile-lgpl/bin
          key: libsndfile-lgpl-${{ runner.os }}-${{ hashFiles('scripts/build_libsndfile_lgpl.ps1') }}

      - name: Build LGPL libsndfile
        timeout-minutes: 15
        shell: pwsh
        run: ./scripts/build_libsndfile_lgpl.ps1

      - name: Save LGPL libsndfile cache
        if: steps.libsndfile_cache_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            app/release-sources/libsndfile-1.2.2.tar.xz
            tools/libsndfile-lgpl/bin
          key: libsndfile-lgpl-${{ runner.os }}-${{ hashFiles('scripts/build_libsndfile_lgpl.ps1') }}

      - name: Build desktop application
        timeout-minutes: 15
        working-directory: app
        env:
          EARCOPY_REUSE_TRACKED_ICON: "1"
        run: |
          npm run assert:app-stopped
          npm run build:icon
          npm run build

      - name: Prepare local beat analysis model
        run: uv run python scripts/download_beat_model.py

      - name: Build packaged Python backend
        timeout-minutes: 30
        working-directory: app
        run: >-
          uv run --project .. pyinstaller --noconfirm
          --distpath backend-dist
          --workpath backend-build
          packaging/earcopy_service.spec

      - name: Remove unused native WebGL module
        shell: pwsh
        working-directory: app
        run: |
          $glModule = Join-Path $PWD "node_modules\gl"
          if (Test-Path -LiteralPath $glModule) {
            Remove-Item -LiteralPath $glModule -Recurse -Force
          }
          if (Test-Path -LiteralPath $glModule) {
            throw "The native WebGL module remains in the package input."
          }

      - name: Remove backend build intermediates
        shell: pwsh
        run: ./scripts/cleanup_ci_release_build.ps1 -Phase BeforeDesktopPackaging

      - name: Package desktop application
        timeout-minutes: 30
        working-directory: app
        run: >-
          npm exec electron-builder --
          --win --dir
          --config.directories.output=release-staging

      - name: Promote packaged application
        timeout-minutes: 20
        working-directory: app
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File packaging/promote-packaged-build.ps1

      - name: Run packaged application smoke test
        timeout-minutes: 10
        working-directory: app
        shell: pwsh
        run: |
          foreach ($sampleRate in @(8000, 48000, 96000)) {
            $env:EARCOPY_SMOKE_SAMPLE_RATE = [string]$sampleRate
            npm run smoke:packaged
            if ($LASTEXITCODE -ne 0) {
              throw "Packaged smoke test failed at $sampleRate Hz."
            }
          }

      - name: Remove build intermediates
        timeout-minutes: 20
        shell: pwsh
        run: ./scripts/cleanup_ci_release_build.ps1 -Phase AfterPackaging

      - name: Install release inspector
        shell: pwsh
        run: ./scripts/install_release_inspector.ps1

      - name: Build release archives
        timeout-minutes: 90
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File app/packaging/build-release-package.ps1

      - name: Verify release archives
        timeout-minutes: 30
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File app/packaging/verify-release-package.ps1 -CoreOnly

      - name: Create release staging draft
        timeout-minutes: 60
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: >-
          ./scripts/publish_draft_release.ps1
          -RequestedTag $env:REQUESTED_TAG

      - name: Save Windows validation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-validation
          path: app/release-validation/*.json
          if-no-files-found: ignore
          retention-days: 90

  publish-muscriptor-models:
    name: Add MuScriptor model assets
    needs: build
    runs-on: windows-latest
    environment: windows-release
    timeout-minutes: 240
    env:
      REQUESTED_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          clean: true
          persist-credentials: false

      - name: Remove previous build outputs
        shell: pwsh
        run: ./scripts/cleanup_ci_release_build.ps1 -Phase BeforeBuild

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Restore MuScriptor small cache
        id: muscriptor_small_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: models/muscriptor/small
          key: muscriptor-small-${{ runner.os }}-${{ hashFiles('app/packaging/verify-muscriptor-models.ps1') }}

      - name: Require MuScriptor small cache
        if: steps.muscriptor_small_cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: throw "Validated MuScriptor small cache was not found."

      - name: Add MuScriptor small release asset
        timeout-minutes: 45
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./scripts/publish_ci_muscriptor_model.ps1
          -Variant small
          -RequestedTag $env:REQUESTED_TAG

      - name: Remove MuScriptor small files
        shell: pwsh
        run: ./scripts/cleanup_ci_release_build.ps1 -Phase AfterPackaging

      - name: Restore MuScriptor medium cache
        id: muscriptor_medium_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: models/muscriptor/medium
          key: muscriptor-medium-${{ runner.os }}-${{ hashFiles('app/packaging/verify-muscriptor-models.ps1') }}

      - name: Require MuScriptor medium cache
        if: steps.muscriptor_medium_cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: throw "Validated MuScriptor medium cache was not found."

      - name: Add MuScriptor medium release asset
        timeout-minutes: 45
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./scripts/publish_ci_muscriptor_model.ps1
          -Variant medium
          -RequestedTag $env:REQUESTED_TAG

      - name: Remove MuScriptor medium files
        shell: pwsh
        run: ./scripts/cleanup_ci_release_build.ps1 -Phase AfterPackaging

      - name: Restore MuScriptor large cache
        id: muscriptor_large_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: models/muscriptor/large
          key: muscriptor-large-${{ runner.os }}-${{ hashFiles('app/packaging/verify-muscriptor-models.ps1') }}

      - name: Require MuScriptor large cache
        if: steps.muscriptor_large_cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: throw "Validated MuScriptor large cache was not found."

      - name: Add MuScriptor large release asset
        timeout-minutes: 90
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./scripts/publish_ci_muscriptor_model.ps1
          -Variant large
          -RequestedTag $env:REQUESTED_TAG

      - name: Remove build intermediates
        shell: pwsh
        run: ./scripts/cleanup_ci_release_build.ps1 -Phase AfterPackaging

      - name: Remove MuScriptor source assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./scripts/remove_ci_muscriptor_model_sources.ps1
          -RequestedTag $env:REQUESTED_TAG

      - name: Save model validation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: model-validation
          path: app/release-validation/*.json
          if-no-files-found: ignore
          retention-days: 90

  verify-draft:
    name: Verify complete release draft
    needs: publish-muscriptor-models
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          clean: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install release inspector
        shell: pwsh
        run: ./scripts/install_release_inspector.ps1

      - name: Verify CI assets and distribution contents
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: >-
          ./scripts/verify_ci_release_draft.ps1
          -RequestedTag $env:REQUESTED_TAG

      - name: Save distribution validation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-validation
          path: app/release-validation/*.json
          if-no-files-found: error
          retention-days: 90

  remove-failed-draft:
    name: Remove failed CI release draft
    needs: [prepare-muscriptor-models, build, publish-muscriptor-models, verify-draft]
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Remove failed draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: ./scripts/remove_failed_ci_release.ps1 -RequestedTag $env:REQUESTED_TAG
