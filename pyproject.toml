[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "earcopy-assist"
version = "0.1.0"
description = "耳コピ補助アプリのローカルサービスとプロジェクト基盤"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.14"
dependencies = [
  "einops>=0.8,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "librosa>=0.11,<1",
  "mido>=1.3,<2",
  "muscriptor>=0.2.2,<0.3",
  "numpy>=1.26,<2",
  "packaging>=24,<27",
  "pydantic>=2.10,<3",
  "rotary-embedding-torch>=0.8.9,<0.10",
  "scipy>=1.13,<2",
  "soundfile>=0.12,<1",
  "starlette>=0.46,<2",
  "torch==2.2.2",
  "torchaudio==2.2.2",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[project.scripts]
earcopy-service = "earcopy_service.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/earcopy_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }
